{% extends 'jobseekerbase.html' %}
{% load static %}

{% block jobseeker %}
<div class="container py-4">

  <!-- TITLE -->
  <div class="text-center mb-4">
    <h3 class="fw-bold">Change Password</h3>
    <p class="text-muted">Update your account security</p>
  </div>

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card border-0 shadow-lg rounded-5 p-4">

        <form method="post">
          {% csrf_token %}

          <!-- OLD PASSWORD -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Old Password</label>
            <input type="password"
                   name="oldpwd"
                   class="form-control"
                   placeholder="Enter old password"
                   required>
          </div>

          <!-- NEW PASSWORD -->
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password"
                   name="newpwd"
                   class="form-control"
                   placeholder="Enter new password"
                   required>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input type="password"
                   name="conpwd"
                   class="form-control"
                   placeholder="Confirm new password"
                   required>
          </div>

          <!-- BUTTON -->
          <button type="submit" class="btn btn-success w-100 py-2">
            Update Password
          </button>

        </form>

      </div>

    </div>

  </div>

</div>

{% endblock %}
