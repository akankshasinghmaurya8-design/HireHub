{% extends 'employerbase.html' %}
{% load static %}

{% block employer %}

<div class="container-fluid py-4">

    <!-- HEADER -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-1 fw-bold">
                    Welcome, {{ emp.first_name }} 👋
                </h4>
                <p class="text-muted mb-0">Manage your profile & company details</p>
            </div>

            <img src="{% if emp.picture %}{{ emp.picture.url }}{% else %}{% static 'images/default-user.png' %}{% endif %}"
                 class="rounded-circle"
                 width="70" height="70">
        </div>
    </div>


    <!-- TABS -->
    <ul class="nav nav-pills mb-3" id="empTab">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#personal">
                Personal Details
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#company">
                Company Details
            </button>
        </li>
    </ul>


    <div class="tab-content">

        <!-- PERSONAL -->
        <div class="tab-pane fade show active" id="personal">

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" name="first_name" value="{{ emp.first_name }}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" name="last_name" value="{{ emp.last_name }}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">DOB</label>
                                <input type="date" name="dob" value="{{ emp.dob|date:'Y-m-d' }}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Gender</label>
                                <select name="gender" class="form-select">
                                    <option value="female" {% if emp.gender == 'female' %}selected{% endif %}>Female</option>
                                    <option value="male" {% if emp.gender == 'male' %}selected{% endif %}>Male</option>
                                    <option value="na" {% if emp.gender == 'na' %}selected{% endif %}>Prefer not to say</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Contact</label>
                                <input type="text" name="contact_no" value="{{ emp.contact_no }}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Designation</label>
                                <input type="text" name="designation" value="{{ emp.designation }}" class="form-control">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Profile Picture</label>
                                <input type="file" name="picture" class="form-control">
                            </div>

                            <div class="col-md-12 text-end">
                                <button class="btn btn-primary px-4">Save Changes</button>
                            </div>

                        </div>
                    </form>

                </div>
            </div>

        </div>


        <!-- COMPANY -->
        <div class="tab-pane fade" id="company">

            {% if emp.company %}
            <div class="alert alert-success">
                Company already added ✔
            </div>
            {% endif %}

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">

                    <form method="post" enctype="multipart/form-data" action="{% url 'save_company' %}">
                        {% csrf_token %}

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Company Name</label>
                                <input type="text" name="company_name" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Contact</label>
                                <input type="text" name="contact_no" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Location</label>
                                <input type="text" name="location" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Website</label>
                                <input type="text" name="website" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Industry</label>
                                <input type="text" name="industry" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Established</label>
                                <input type="date" name="established_at" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Logo</label>
                                <input type="file" name="logo" class="form-control">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Details</label>
                                <textarea name="details" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="col-md-12 text-end">
                                <button class="btn btn-success px-4">Save Company</button>
                            </div>

                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>

</div>

{% endblock %}
